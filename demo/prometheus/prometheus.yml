global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: k6-test-app
    scrape_interval: 10s
    metrics_path: /actuator/prometheus
    static_configs:
      # Приложение на хосте (localhost:8080); host.docker.internal — адрес хоста из контейнера Prometheus
      - targets: ["host.docker.internal:8080"]
        labels:
          env: demo
          service: k6-test-app
